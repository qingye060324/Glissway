<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f8f9fa" id="themeColor">
<title>Glissway</title>
<script>
// Mark native inset ownership before the first layout; the host also marks page loads.
if (window.GlisswayMidi) document.documentElement.classList.add('inset-native');
</script>
<style>
:root {
  --color-background:#f8f9fa; --color-surface:#edf0f2; --color-bubble:#a7b1b5;
  --color-on-surface:#191d1f; --color-on-surface-variant:#505a5e; --color-on-bubble:#ffffff; --color-on-bubble-variant:#172124;
  --color-primary:#43636c; --color-on-primary:#fff; --color-secondary:#56656a;
  --color-primary-container:#d1e6ed; --color-on-primary-container:#152e36;
  --color-outline:#717c80; --color-highlight:#ffffff; --color-shadow:#bcc4c8;
  --color-glass-edge:#ffffffb3; --color-scrim:#10191e4d;
  --color-status:#398654; --color-status-halo:#39865426;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; width:100%; height:100%; overflow:hidden; overscroll-behavior:none; }
body { font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
  background:var(--color-surface); color:var(--color-on-surface); }
button,input,select { font:inherit; }
button { cursor:pointer; color:inherit; }
button:focus-visible,input:focus-visible,select:focus-visible { outline:2px solid var(--color-primary); outline-offset:3px; }
button { -webkit-user-select:none; user-select:none; }
[hidden] { display:none !important; }
.phone { width:100%; height:100%; height:100dvh; }
.screen { position:relative; width:100%; height:100%; overflow:hidden; isolation:isolate;
  background:var(--color-background); color:var(--color-on-surface); user-select:none;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px); }
html.inset-native .screen { --safe-top:0px; --safe-bottom:0px; }
.raised,.raised-sm { background:var(--color-surface); border:1px solid var(--color-glass-edge);
  box-shadow:4px 5px 11px var(--color-shadow),-3px -3px 9px var(--color-highlight),inset 0 1px 1px var(--color-highlight); }
.inset,.inset-sm { background:var(--color-surface);
  box-shadow:inset 3px 3px 7px var(--color-shadow),inset -3px -3px 7px var(--color-highlight); }
.glass { background:var(--color-surface); border:1px solid var(--color-glass-edge);
  box-shadow:inset 0 1px 1px var(--color-highlight),inset 0 -1px 2px var(--color-shadow),0 5px 14px var(--color-shadow); }
.top { position:absolute; top:calc(var(--safe-top) + 28px); left:0; right:0; display:flex;
  justify-content:center; align-items:center; z-index:20; pointer-events:none; }
.seg { position:relative; display:flex; border-radius:24px; padding:4px; pointer-events:auto; }
.seg::before { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; opacity:0;
  box-shadow:0 0 8px 2px var(--color-status-halo),0 0 18px 5px var(--color-status-halo),0 0 28px 7px var(--color-status-halo);
  transition:opacity .18s ease; }
.seg.connected::before { opacity:1; }
@media (prefers-reduced-motion:reduce) { .seg::before { transition:none; } }
.seg button { border:0; background:none; font-weight:650; font-size:15px; padding:8px 22px; border-radius:19px; }
.seg button.on { background:var(--color-background); box-shadow:0 2px 7px var(--color-shadow); }
.settings-button { position:absolute; right:14px; top:calc(var(--safe-top) + 35px); z-index:21;
  border:0; border-radius:50%; padding:7px; background:transparent; color:var(--color-on-surface-variant); }
.settings-button svg { width:19px; height:19px; display:block; fill:none; stroke:currentColor; stroke-width:1.6; }
.view { position:absolute; inset:0; }
.ib { width:44px; height:44px; flex:none; border-radius:50%; border:0; display:grid; place-items:center; }
.ib:active,.chip:active { box-shadow:inset 3px 3px 7px var(--color-shadow),inset -3px -3px 7px var(--color-highlight); }
.ib svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; }
/* The bubble is ONLY this opaque SVG fill. No filter, gradient, shadow or CSS motion. */
#bubbleSvg { position:absolute; inset:0; width:100%; height:100%; touch-action:none; overflow:hidden; }
#bubblePath { fill:var(--color-bubble); }
.readouts { fill:var(--readout-ink,var(--color-on-surface)); font-weight:850; font-variant-numeric:tabular-nums; letter-spacing:-2px; }
.readout-label { fill:var(--label-ink,var(--color-on-surface-variant)); font-weight:750; letter-spacing:1.4px; }
/* CSS variables inherit through SVG <use>'s shadow tree; descendant selectors do not. */
.inside { --readout-ink:var(--color-on-bubble); --label-ink:var(--color-on-bubble-variant); }
.axis { position:absolute; top:calc(var(--safe-top) + 86px); left:0; right:0; display:flex;
  justify-content:center; gap:10px; pointer-events:none; }
.pill { font-size:11px; padding:6px 12px; border-radius:16px; color:var(--color-on-surface-variant); font-variant-numeric:tabular-nums; }
.pdock { position:absolute; bottom:calc(var(--safe-bottom) + 28px); left:14px; right:14px;
  display:flex; gap:10px; align-items:center; z-index:5; }
.chip { flex:1; display:flex; align-items:center; gap:8px; border-radius:29px;
  padding:9px 10px 9px 7px; text-align:left; min-width:0; min-height:57px; }
.chip em { font-style:normal; width:32px; height:32px; flex:none; border-radius:50%; display:grid;
  place-items:center; font-weight:800; font-size:14px; background:var(--color-primary); color:var(--color-on-primary); }
.chip > span { min-width:0; }
.chip b { display:block; font-size:10px; letter-spacing:1.05px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chip small { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:10px; color:var(--color-on-surface-variant); margin-top:3px; }
.chip[aria-expanded="true"] { background:var(--color-primary-container); color:var(--color-on-primary-container); }
.hint { position:absolute; top:calc(var(--safe-top) + 104px); left:0; right:0; text-align:center;
  font-size:12px; color:var(--color-on-surface-variant); }
.rail { position:absolute; top:calc(var(--safe-top) + 136px); left:0; right:0; bottom:calc(var(--safe-bottom) + 133px);
  display:flex; gap:22px; padding:14px 28px; overflow-x:auto; scrollbar-width:none; scroll-snap-type:x mandatory; }
.ctl { flex:none; width:104px; display:flex; flex-direction:column; align-items:center; scroll-snap-align:start; }
.track { position:relative; width:104px; flex:1; border-radius:52px; cursor:ns-resize; touch-action:none; overflow:hidden; min-height:110px; }
.fill { position:absolute; left:7px; right:7px; bottom:7px; border-radius:45px; min-height:50px;
  background:var(--color-primary); box-shadow:inset 0 2px 2px var(--color-highlight); }
.fill b { position:absolute; top:16px; left:0; right:0; text-align:center; font-weight:800; font-size:20px;
  color:var(--color-on-primary); font-variant-numeric:tabular-nums; }
.ctl.off .fill { opacity:.45; }
.name { margin-top:16px; padding:0; background:none; border:0; font-weight:800; font-size:11px; letter-spacing:1.6px; }
.sub { font-size:10px; color:var(--color-on-surface-variant); margin-top:3px; }
.add { flex:none; width:104px; border-radius:52px; color:var(--color-on-surface-variant); font-size:34px; margin-bottom:46px; }
.dock { position:absolute; bottom:calc(var(--safe-bottom) + 32px); left:50%; transform:translateX(-50%);
  display:flex; gap:clamp(6px,2.6vw,14px); padding:10px; border-radius:34px; max-width:calc(100% - 20px); }
.scrim { position:absolute; inset:0; background:var(--color-scrim); z-index:30; }
.sheet { position:absolute; left:10px; right:10px; bottom:calc(var(--safe-bottom) + 10px); z-index:31;
  border-radius:30px; padding:20px 18px 24px; max-height:calc(100% - var(--safe-top) - var(--safe-bottom) - 30px);
  overflow:auto; overscroll-behavior:contain; user-select:text; }
.sheet h3 { font-size:17px; margin:0 0 14px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.sheet h4 { margin:18px 0 8px; font-size:13px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.field { border-radius:18px; padding:10px 12px; min-width:0; }
.field span { display:block; font-size:10px; color:var(--color-on-surface-variant); margin-bottom:4px; letter-spacing:.5px; }
.field input,.field select { width:100%; min-width:0; font-size:16px; color:var(--color-on-surface);
  background:transparent; border:0; padding:3px 0; }
.segaxis { grid-column:1/-1; display:flex; border-radius:18px; padding:4px; }
.segaxis button { flex:1; border:0; background:none; padding:10px 0; border-radius:14px; font-size:12px; color:var(--color-on-surface-variant); }
.segaxis button.on { color:var(--color-on-primary-container); background:var(--color-primary-container); }
.toggle { grid-column:1/-1; display:flex; justify-content:space-between; align-items:center; padding:4px; gap:12px; font-size:13px; }
input[type="checkbox"],input[type="range"] { accent-color:var(--color-primary); }
.toggle input { width:20px; height:20px; }
.pick { grid-column:1/-1; display:flex; flex-wrap:wrap; gap:8px; }
.pick button,.action { border:0; border-radius:16px; padding:11px 14px; font-weight:650; font-size:11px; }
.pick button.on,.action { background:var(--color-primary-container); color:var(--color-on-primary-container); }
.wide { grid-column:1/-1; }
.note { margin:10px 0; color:var(--color-on-surface-variant); font-size:11px; line-height:1.65; }
.debug-slider { display:block; margin:16px 0; font-size:13px; }
.debug-slider input { display:block; width:100%; margin-top:10px; }
.stats { font-size:11px; font-variant-numeric:tabular-nums; line-height:1.9; color:var(--color-on-surface-variant); }
.seed-picker { display:flex; align-items:center; gap:10px; font-size:12px; margin-top:12px; }
.seed-picker input { width:38px; height:32px; border:0; padding:0; background:none; }
.preset-list { display:grid; gap:8px; margin:14px 0; }
.preset-row { text-align:left; border-radius:18px; padding:14px; font-size:14px; }
.preset-row.on { background:var(--color-primary-container); color:var(--color-on-primary-container); }
.preset-row small { display:block; opacity:.75; margin-top:4px; font-size:11px; }
.preset-summary { font-size:13px; line-height:1.6; overflow-wrap:anywhere; }
#presetHint { display:inline-block; margin-top:6px; font-size:10px; }
button:disabled { opacity:.45; cursor:default; }
.toast { position:absolute; left:50%; bottom:calc(var(--safe-bottom) + 100px); transform:translateX(-50%);
  border-radius:20px; padding:9px 15px; background:var(--color-on-surface); color:var(--color-background);
  font-size:12px; z-index:60; white-space:nowrap; pointer-events:none; }
@media (min-width:600px) and (min-height:650px) {
  body { display:grid; place-items:center; }
  .phone { width:390px; height:min(844px,calc(100dvh - 36px)); padding:8px; border-radius:42px;
    background:var(--color-on-surface); box-shadow:0 14px 40px var(--color-shadow); }
  .screen { border-radius:34px; }
}
@media (max-width:350px) {
  .pdock { gap:7px; left:10px; right:10px; }
  .chip { padding-right:6px; gap:5px; }.chip b { font-size:9px; letter-spacing:.5px; }
  .seg button { padding:8px 18px; }
  .dock { gap:6px; padding:8px; }.dock .ib { width:42px; height:42px; }
}
@media (orientation:landscape) and (max-height:600px) {
  .top { top:calc(var(--safe-top) + 12px); }.axis { top:calc(var(--safe-top) + 64px); }
  .settings-button { top:calc(var(--safe-top) + 18px); }
  .pdock { bottom:calc(var(--safe-bottom) + 14px); left:20%; right:20%; }
  .rail { top:90px; bottom:95px; }.hint { top:72px; }.dock { bottom:14px; }
}
</style>
</head>
<body>
<div class="phone"><main class="screen" id="screen" aria-label="Glissway 控制器">
  <div class="top">
    <div class="seg glass" id="modeCapsule" role="group" aria-label="Edit / Live · MIDI 未连接">
      <button id="bEdit" aria-pressed="false">Edit</button><button id="bLive" class="on" aria-pressed="true">Live</button>
    </div>
  </div>
  <button class="settings-button" id="settings" title="姿态与主题设置" aria-label="姿态与主题设置">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="var(--color-background)"/><circle cx="15" cy="17" r="3" fill="var(--color-background)"/></svg>
  </button>
  <section class="view" id="live" aria-label="Live">
    <svg id="bubbleSvg" xmlns="http://www.w3.org/2000/svg" aria-label="姿态气泡与 MIDI 输出">
      <defs>
        <clipPath id="screenClip" clipPathUnits="userSpaceOnUse"><rect id="screenBounds"/></clipPath>
        <clipPath id="bubbleClip" clipPathUnits="userSpaceOnUse"><path id="clipContour"/></clipPath>
      </defs>
      <g clip-path="url(#screenClip)">
      <path id="bubblePath"/>
      <g id="readoutContent" text-anchor="middle">
        <text class="readouts" id="valueX">50%</text><text class="readouts" id="valueY">50%</text>
        <text class="readout-label" id="labelX">X · DYNAMICS</text><text class="readout-label" id="labelY">Y · VIBRATO</text>
      </g>
      <g class="inside" clip-path="url(#bubbleClip)" aria-hidden="true"><use href="#readoutContent"/></g>
      </g>
    </svg>
    <div class="axis"><span class="pill inset-sm" id="pRoll">Roll 0.0°</span><span class="pill inset-sm" id="pPitch">Pitch 0.0°</span></div>
    <div class="pdock">
      <button class="chip raised-sm" id="asX" aria-expanded="false"><em>X</em><span><b id="xName">DYNAMICS</b><small id="xSub">CC 1 · 左右倾斜</small></span></button>
      <button class="chip raised-sm" id="asY" aria-expanded="false"><em>Y</em><span><b id="yName">VIBRATO</b><small id="ySub">CC 21 · 前后倾斜</small></span></button>
      <button class="ib raised-sm" id="calib" title="当前姿态归零" aria-label="当前姿态归零"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
    </div>
  </section>
  <section class="view" id="edit" hidden aria-label="Edit">
    <div class="hint">上下拖动推子 · 点名称编辑映射<br><span id="presetHint"></span></div><div class="rail" id="rail"></div>
    <div class="dock glass">
      <button class="ib raised-sm" id="mapList" title="映射列表" aria-label="映射列表"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
      <button class="ib raised-sm" id="connect" title="MIDI 连接" aria-label="MIDI 连接"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></button>
      <button class="ib raised-sm" id="calib2" title="当前姿态归零" aria-label="当前姿态归零"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
      <button class="ib raised-sm" id="presets" title="Presets" aria-label="Presets"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
      <button class="ib raised-sm" id="help" title="帮助" aria-label="帮助"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg></button>
    </div>
  </section>
  <div id="sheetWrap" hidden><div class="scrim" id="scrim"></div><section class="sheet glass" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1"></section></div>
  <div class="toast" id="toast" hidden role="status"></div>
</main></div>
<script src="glissway-presets.js"></script>
<script>
'use strict';
/* Browser UI / Android WebView contract (no third-party dependencies).
   Glissway.applyTheme({light:{...roles},dark:{...roles},mode:'system'})
   Roles: background,surface,bubble,onSurface,onSurfaceVariant,onBubble,onBubbleVariant,primary,
          onPrimary,secondary,primaryContainer,onPrimaryContainer,outline.
   Native resolves Android 12+ dynamicLightColorScheme / dynamicDarkColorScheme,
   including its secondary/neutralVariant tone for bubble, then sends #RRGGBB.
   Re-send on wallpaper/UI-mode changes. HTML cannot read Android Monet itself.
   Glissway.setPose({roll:degrees,pitch:degrees}) // raw, CURRENT screen axes
   Glissway.setDeviceOrientation({beta:degrees,gamma:degrees,screenAngle:degrees})
   Glissway.setConnection({connected:true,label:'BLE MIDI'})
   Native window.GlisswayMidi.sendCC(channel,cc,value), sendPitchBend(channel,value).
   Events: 'glissway-midi' detail={channel,cc,value}; 'glissway-pose' detail=metrics.
   Pose solver has NO history, velocity, spring, interpolation or temporal filter.
*/
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const rad = v => v*Math.PI/180;
const deg = v => v*180/Math.PI;
const finite = v => typeof v==='number' && Number.isFinite(v);
const AX = ['ROLL','PITCH','MANUAL'];
const defaults = [
  {name:'DYNAMICS',cc:1,ch:1,axis:0,v:64,lo:0,hi:127,range:45,inv:false,on:true},
  {name:'VIBRATO',cc:21,ch:1,axis:1,v:64,lo:0,hi:127,range:35,inv:false,on:true},
  {name:'EXPRESSION',cc:11,ch:1,axis:1,v:70,lo:0,hi:127,range:60,inv:false,on:true},
  {name:'REVERB',cc:91,ch:1,axis:2,v:58,lo:0,hi:127,range:64,inv:false,on:false}
];
const storageKey='glissway-settings';
let saved=null,migrationNotice='';
try {
  saved=JSON.parse(localStorage.getItem(storageKey));
  // The only retired brand token is this one-time storage lookup; keep user settings on upgrade.
  if(!saved) {
    const legacyKey='tilt-midi-nuectrl-v4',raw=localStorage.getItem(legacyKey);
    if(raw) {
      saved=JSON.parse(raw);localStorage.setItem(storageKey,raw);
      localStorage.setItem('glissway-settings-migration-backup',raw);localStorage.removeItem(legacyKey);
    } else {
      const rawNative=window.GlisswayMidi?.getLegacyConfig();
      if(rawNative&&rawNative!=='null')saved=JSON.parse(rawNative);
    }
  }
} catch(error) { migrationNotice='旧配置未能读取；原数据仍保留。'; }
const newMapId=()=>globalThis.crypto?.randomUUID?.()||'map-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
function cleanMap(m) {
  if(!m||typeof m!=='object')throw new Error('无效控制器');
  const output=m.output==='pitchbend'?'pitchbend':'cc',max=output==='pitchbend'?16383:127;
  const number=(v,fallback,lo,hi)=>clamp(Number.isFinite(+v)?+v:fallback,lo,hi);
  const manual=Math.round(number(m.manual??m.v,output==='pitchbend'?8192:64,0,max));
  return {id:typeof m.id==='string'&&m.id?m.id:newMapId(),name:String(m.name||'CTRL').slice(0,24),output,
    cc:Math.round(number(m.cc,1,0,127)),ch:Math.round(number(m.ch,1,1,16)),axis:Math.round(number(m.axis,0,0,2)),
    manual,v:manual,lo:Math.round(number(m.lo,0,0,127)),hi:Math.round(number(m.hi,127,0,127)),
    range:number(m.range,45,1,180),sensitivity:number(m.sensitivity,1,.1,4),inv:!!m.inv,on:m.on!==false};
}
function cleanConfig(value) {
  if(!value||!Array.isArray(value.maps)||!value.maps.length||value.maps.length>32)throw new Error('无效预设映射');
  const result=value.maps.map(cleanMap),ids=new Set(),bends=new Set();
  for(const m of result) {
    if(ids.has(m.id))m.id=newMapId();ids.add(m.id);
    if(m.on&&m.output==='pitchbend') {
      if(bends.has(m.ch))throw new Error('Pitch Bend 通道冲突：请使用不同 MIDI 通道。');bends.add(m.ch);
    }
  }
  return {maps:result.map(({v,...m})=>m),selX:clamp(Math.round(+value.selX||0),0,result.length-1),
    selY:clamp(Math.round(+(value.selY??1)||0),0,result.length-1),cfg:{
      maxAngle:clamp(+value.cfg?.maxAngle||45,5,85),sensitivity:clamp(+value.cfg?.sensitivity||1,.25,2.5),
      invertX:!!value.cfg?.invertX,invertY:!!value.cfg?.invertY}};
}
let maps;
try { maps=(Array.isArray(saved?.maps)&&saved.maps.length?saved.maps.slice(0,32):defaults).map(cleanMap); }
catch(error) {
  try { if(saved)localStorage.setItem('glissway-settings-recovery',JSON.stringify(saved)); } catch (_) {}
  maps=defaults.map(cleanMap);migrationNotice='旧映射无效；原数据已保留，请检查迁移备份。';
}
let selX=clamp(saved?.selX||0,0,maps.length-1),selY=clamp(saved?.selY??1,0,maps.length-1);
const cfg={maxAngle:clamp(saved?.cfg?.maxAngle||45,5,85),sensitivity:clamp(saved?.cfg?.sensitivity||1,.25,2.5),
  invertX:!!saved?.cfg?.invertX,invertY:!!saved?.cfg?.invertY};
try { restoreConfig({maps,selX,selY,cfg}); }
catch(error) {
  try { if(saved)localStorage.setItem('glissway-settings-recovery',JSON.stringify(saved)); } catch (_) {}
  restoreConfig({maps:defaults,selX:0,selY:1,cfg:{}});migrationNotice='无效设置已保留备份，已恢复默认控制配置。';
}
let liveMode=true,presetStore=null;
function captureConfig() { return cleanConfig({maps,selX,selY,cfg}); }
function restoreConfig(value) {
  const clean=cleanConfig(value);maps=clean.maps.map(cleanMap);selX=clean.selX;selY=clean.selY;Object.assign(cfg,clean.cfg);
}
function updatePresetHint() {
  if(!presetStore)return;

  if(lastSolution) {
    const s=lastSolution,covered=v=>v?'被覆盖':'已露出',edges=s.contactEdges;
    $('#debugStats').textContent=`输入：${source} · 屏幕方向 ${screenAngle()}°\n实际姿态：Roll ${t.roll.toFixed(1)}° / Pitch ${t.pitch.toFixed(1)}°\nMIDI ${liveMode?'Live':'Edit'}：X ${percent(maps[selX],maps[selX].v)} / Y ${percent(maps[selY],maps[selY].v)}（百分比不代表倾角）\n重力：(${s.gravity.x.toFixed(3)}, ${s.gravity.y.toFixed(3)}) · 高处：(${s.high.x.toFixed(3)}, ${s.high.y.toFixed(3)})\n屏幕正中心 (${(W/2).toFixed(1)}, ${(H/2).toFixed(1)})：${covered(s.screenCenterCovered)}\n默认气泡中心 (${s.restCenter.x.toFixed(1)}, ${s.restCenter.y.toFixed(1)})：${covered(s.restCenterCovered)}\n完整轮廓实际重心：(${s.centroid.x.toFixed(2)}, ${s.centroid.y.toFixed(2)})\n可见面积 / 默认可见面积：${(s.visibleAreaRatio*100).toFixed(2)}%\n完整面积误差：${s.areaError.toFixed(5)}%\n边缘接触：左 ${edges.left?'是':'否'} / 右 ${edges.right?'是':'否'} / 上 ${edges.top?'是':'否'} / 下 ${edges.bottom?'是':'否'}\n圆角接触：${s.roundedCornerContact?'是':'否'} · 可见面积采样容差 ${s.metricTolerance} px`;
    $('#debugStats').style.whiteSpace='pre-line';
  }
}
$('#mapList').onclick=()=>{
  openSheet('映射列表',`<div class="pick">${maps.map((m,i)=>`<button class="raised-sm" data-edit="${i}">${esc(m.name)} · ${outputLabel(m)}</button>`).join('')}</div>`,'list');
  $('#sheet').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>mappingSheet(+b.dataset.edit));
};
let presetSelection=null;
function presetError(error) { toast('预设保存失败：'+error.message); }
function presetsSheet(selected=presetSelection) {
  if(!presetStore){toast('预设存储不可用；请检查设备存储空间。');return;}
  const current=presetStore.current(),entries=presetStore.list();
  presetSelection=entries.some(p=>p.id===selected)?selected:current.id;
  const dirty=presetStore.dirty(captureConfig());
  openSheet('Presets',`<div class="preset-summary">当前：<b>${esc(current.name)}</b><br><span>${dirty?'Unsaved Changes · 未保存修改':'已保存'}</span></div>
    <div class="preset-list">${entries.map(p=>`<button class="preset-row raised-sm ${p.id===presetSelection?'on':''}" data-preset="${esc(p.id)}" aria-pressed="${p.id===presetSelection}">${esc(p.name)}${p.id===current.id?'<small>当前已加载</small>':''}</button>`).join('')}</div>
    <div class="grid"><button class="action" id="presetLoad">Load · 加载选中</button><button class="action" id="presetSave" ${dirty?'':'disabled'}>Save · 保存当前</button>
    <button class="action" id="presetSaveAs">Save As · 另存为</button><button class="action" id="presetRename">Rename · 重命名</button>
    <button class="action" id="presetDuplicate">Duplicate · 复制</button><button class="action" id="presetDelete">Delete · 删除</button></div>
    <p class="note">只保存 MIDI 控制配置。主题、当前连接和临时校准保持独立。选中预设后点击 Load 加载。</p>`,'presets');
  $('#sheet').querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>presetsSheet(b.dataset.preset));
  $('#presetSave').onclick=()=>{try{presetStore.save(captureConfig());persist();presetsSheet();toast('预设已保存');}catch(error){presetError(error);}};
  $('#presetSaveAs').onclick=()=>presetNameSheet('saveAs');
  $('#presetRename').onclick=()=>presetNameSheet('rename');
  $('#presetDuplicate').onclick=()=>presetNameSheet('duplicate');
  $('#presetLoad').onclick=()=>requestPresetLoad(presetSelection);
  $('#presetDelete').onclick=()=>{
    const item=entries.find(p=>p.id===presetSelection);
    openSheet('删除预设',`<p class="preset-summary">删除「${esc(item.name)}」？${item.id===current.id&&dirty?'当前未保存的修改也会丢弃。':''}</p><div class="grid"><button class="action" id="cancelDelete">Cancel</button><button class="action" id="confirmDelete">Delete</button></div>`,'preset-delete');
    $('#cancelDelete').onclick=()=>presetsSheet(item.id);
    $('#confirmDelete').onclick=()=>{try{
      // Commit the removal first; failed storage writes must leave the current performance intact.
      const result=presetStore.remove(item.id);
      if(result.currentChanged)applyPresetConfig(result.config);
      persist();presetsSheet();toast('预设已删除');
    }catch(error){presetError(error);}};
  };
}
function presetNameSheet(action) {
  const selected=presetStore.list().find(p=>p.id===presetSelection)||presetStore.current();
  const title={saveAs:'Save As',rename:'Rename',duplicate:'Duplicate'}[action];
  openSheet(title,`<label class="field inset-sm" style="display:block"><span>预设名称 · 支持中文与其他 Unicode</span><input id="presetName" maxlength="160" value="${esc(action==='rename'?selected.name:action==='duplicate'?selected.name+' Copy':'')}" autocomplete="off"></label><p class="note" id="presetNameError" role="status"></p><div class="grid"><button class="action" id="cancelName">Cancel</button><button class="action" id="confirmName">${title}</button></div>`,'preset-name');
  $('#cancelName').onclick=()=>presetsSheet();
  const commit=()=>{try{
    const name=$('#presetName').value;
    if(action==='saveAs'){const item=presetStore.saveAs(name,captureConfig());presetSelection=item.id;}
    else if(action==='rename')presetStore.rename(selected.id,name);
    else {const item=presetStore.duplicate(selected.id,name);presetSelection=item.id;}
    persist();presetsSheet();
  }catch(error){$('#presetNameError').textContent=error.message;}};
  $('#confirmName').onclick=commit;$('#presetName').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();commit();}};
  $('#presetName').focus();
}
function applyPresetConfig(config) {
  resetBends();restoreConfig(config);centerHolds.clear();lastMidi.clear();chips();if(!liveMode)rail();render();syncOutputs();updatePresetHint();
}
function loadPreset(id) {
  try {const config=presetStore.load(id);applyPresetConfig(config);persist();presetsSheet(id);toast('预设已加载');}
  catch(error){presetError(error);}
}
function requestPresetLoad(id) {
  if(!presetStore.dirty(captureConfig())){loadPreset(id);return;}
  openSheet('Unsaved Changes',`<p class="note">当前预设有未保存修改。加载前保存，或丢弃修改？</p><div class="grid"><button class="action" id="saveThenLoad">Save</button><button class="action" id="discardThenLoad">Discard</button><button class="action wide" id="cancelLoad">Cancel</button></div>`,'preset-unsaved');
  $('#saveThenLoad').onclick=()=>{try{presetStore.save(captureConfig());loadPreset(id);}catch(error){presetError(error);}};
  $('#discardThenLoad').onclick=()=>loadPreset(id);$('#cancelLoad').onclick=()=>presetsSheet(id);
}
$('#presets').onclick=()=>presetsSheet();
$('#help').onclick=()=>openSheet('Glissway · 使用方法','<p class="note">Live：手机姿态直接控制 X / Y 绑定的映射，点击底部参数选择映射。气泡向高处浮起，其运动方向可独立反转。</p><p class="note">Edit：拖动推子发送 CC 或 Pitch Bend，点击名称编辑 Output Type、通道、控制轴、角度和范围。Pitch Bend 使用 14-bit 消息，中心为 8192；灵敏度不改变乐器的半音范围。同一通道只允许一个启用的 Pitch Bend 映射。</p><p class="note">Edit 底部书签按钮打开 Presets。Save As 创建命名预设；选中预设后 Load；Save 覆盖当前预设。也可复制、重命名和删除。未保存修改会提示 Save / Discard / Cancel。</p><p class="note">地球按钮连接现有 BLE MIDI 或 RTP-MIDI；胶囊绿光代表可用 MIDI 输出。右上角可启用传感器、校准及切换主题。Android 使用真实原生传输，浏览器使用 Web MIDI。</p>','help');
function updateConnection(connected,label,status) {
  const changed=nativeConnected!==connected||nativeLabel!==label||nativeStatus!==status;
  nativeConnected=connected;nativeLabel=label;nativeStatus=status||(connected?label+' 已连接':'MIDI 未连接');
  const ready=available(),text=ready?(nativeConnected?nativeLabel:midiOutput?.name||'MIDI')+' 已连接':nativeStatus;
  $('#modeCapsule').classList.toggle('connected',ready);$('#modeCapsule').title=text;
  $('#modeCapsule').setAttribute('aria-label','Edit / Live · '+text);
  if($('#connectionStatus'))$('#connectionStatus').textContent=text;
  if(changed){lastMidi.clear();if(ready){render();if(!liveMode)syncOutputs();}}
}
async function connectionSheet() {
  const native=!!window.GlisswayMidi;
  openSheet('MIDI 连接',`<p class="note" id="connectionStatus">${esc(available()?(nativeConnected?nativeLabel:midiOutput?.name)+' 已连接':nativeStatus)}</p>
    <div class="grid">${native?`<button class="action wide" id="startBle">启动 / 重启 BLE MIDI</button>
      <p class="note wide">在接收端 MIDI 设置中连接这台手机。RTP-MIDI 使用电脑现有网络会话；两种连接沿用原应用的切换方式。</p>
      <label class="field inset-sm wide"><span>RTP-MIDI 电脑 IP / Host</span><input id="rtpHost" autocomplete="off" inputmode="url" placeholder="192.168.1.20"></label>
      ${field('AppleMIDI 控制端口','rtpPort',5004,1,65534)}<button class="action" id="connectRtp">连接 RTP-MIDI</button>
      <button class="action wide" id="stopMidi">停止 MIDI</button>`:'<button class="action wide" id="enableMidi">选择 Web MIDI 输出</button><div class="pick" id="midiPorts"></div>'}</div>`,'connection');
  if(native) {
    $('#startBle').onclick=()=>{resetBends();window.GlisswayMidi.startBle();};
    $('#stopMidi').onclick=()=>{resetBends();window.GlisswayMidi.stopMidi();};
    $('#connectRtp').onclick=()=>{
      const host=$('#rtpHost').value.trim(),port=Number($('#rtpPort').value);
      if(!host||!Number.isInteger(port)||port<1||port>65534){toast('请填写电脑 IP 和有效控制端口。');return;}
      resetBends();window.GlisswayMidi.connectRtp(host,port);
    };
    window.GlisswayMidi.requestState();return;
  }
  $('#enableMidi').onclick=async()=>{
    try {
      if(!navigator.requestMIDIAccess)throw new Error('此浏览器不支持 Web MIDI，请在 Android 中使用 BLE / RTP-MIDI。');
      midiAccess=await navigator.requestMIDIAccess({sysex:false});
      function ports() {
        if(sheetKind!=='connection')return;
        const list=$('#midiPorts');list.replaceChildren();
        for(const output of midiAccess.outputs.values()) {
          if(output.state!=='connected')continue;
          const button=document.createElement('button');button.className='raised-sm';button.textContent=output.name;
          button.onclick=async()=>{try{resetBends();await midiOutput?.close();midiOutput=null;await output.open();midiOutput=output;lastMidi.clear();updateConnection(nativeConnected,nativeLabel);syncOutputs();toast('MIDI 输出已连接');closeSheet();}catch(error){updateConnection(nativeConnected,nativeLabel);toast(error.message);}};list.append(button);
        }
        if(!list.children.length)list.textContent='没有可用的 MIDI 输出设备';
      }
      ports();midiAccess.onstatechange=event=>{
        if(midiOutput?.id===event.port.id&&event.port.state==='disconnected'){midiOutput=null;lastMidi.clear();updateConnection(nativeConnected,nativeLabel);toast('MIDI 输出已断开');}ports();
      };
    } catch(error) { toast(error.message); }
  };
}
$('#connect').onclick=connectionSheet;

// Native calls directly update the same input/render path. No Android dependency.
window.Glissway=Object.freeze({
  applyTheme:payload=>Theme.applyNative(payload),
  setPose:pose=>{
    if(!pose||!finite(pose.roll)||!finite(pose.pitch))return false;
    nativePose={roll:clamp(pose.roll,-180,180),pitch:clamp(pose.pitch,-180,180)};
    stopDemo();sensorEnabled=false;source='native';render();return true;
  },
  setDeviceOrientation:pose=>{
    if(!pose||!finite(pose.beta)||!finite(pose.gamma))return false;
    sensorPose={beta:clamp(pose.beta,-180,180),gamma:clamp(pose.gamma,-90,90),screenAngle:finite(pose.screenAngle)?pose.screenAngle:screenAngle()};
    stopDemo();sensorEnabled=false;source='sensor';render();return true;
  },
  setConnection:state=>{if(state)updateConnection(state.bleConnected===true||state.rtpConnected===true||state.connected===true,String(state.label||'MIDI'),String(state.status||''));},
  suspend:()=>{persist();resetBends();suspended=true;stopDemo();},
  resume:()=>{suspended=false;lastMidi.clear();render();if(!liveMode)syncOutputs();},
  calibrate,simulate:(roll,pitch)=>{if(finite(roll)&&finite(pitch))setSimulation(roll,pitch,true);},
  openDebug:debugSheet,
  getState:()=>({pose:currentPose(),source,config:{...cfg},theme:Theme.info(),colors:Theme.colors(),
    mapping:{x:{...maps[selX]},y:{...maps[selY]}},geometry:lastSolution?{
      cx:lastSolution.cx,cy:lastSolution.cy,width:lastSolution.a*2,height:lastSolution.b*2,area:lastSolution.area,
      targetArea:lastSolution.targetArea,areaError:lastSolution.areaError,gravity:{...lastSolution.gravity},contact:lastSolution.contact,
      centroid:{...lastSolution.centroid},restCenter:{...lastSolution.restCenter},
      screenCenterCovered:lastSolution.screenCenterCovered,restCenterCovered:lastSolution.restCenterCovered,
      visibleArea:lastSolution.visibleArea,defaultVisibleArea:lastSolution.defaultVisibleArea,visibleAreaRatio:lastSolution.visibleAreaRatio,
      contactEdges:{...lastSolution.contactEdges},roundedCornerContact:lastSolution.roundedCornerContact,metricTolerance:lastSolution.metricTolerance}:null}),
  // Deterministic, read-only solver useful for integration diagnostics / regression checks.
  solve:(width,height,roll,pitch,options={})=>{
    if(![width,height,roll,pitch].every(finite)||width<50||height<50)return null;
    return solveBubble(width,height,roll,pitch,{...cfg,...options});
  }
});
addEventListener('pagehide',()=>{persist();resetBends();});
try {
  presetStore=GlisswayPresetStore.create({initialConfig:captureConfig(),validateConfig:cleanConfig,onError:error=>{migrationNotice='预设存储：'+error.message;}});
  restoreConfig(presetStore.working());
} catch(error) { migrationNotice='预设存储不可用：'+error.message; }
chips();resize();updatePresetHint();
if(migrationNotice)setTimeout(()=>toast(migrationNotice),500);
if(window.GlisswayMidi)window.GlisswayMidi.requestState();
</script>
